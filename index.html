<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Weather App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">We@ther App</a>

      <form class="d-flex" role="search" id="searchForm">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Enter city"
          id="cityInput"
          required
        >
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <!-- Weather Display -->
  <div class="weather-display">

    <!-- VIDEO -->
    <video id="weather-video" autoplay muted loop playsinline>
      <source src="sunny.mp4" type="video/mp4">
    </video>

    <!-- MAIN WEATHER -->
    <div class="weather-overlay">
      <h1 id="cityName">Delhi</h1>

      <div class="temperature">
        <span id="temp">--</span>°C
      </div>

      <div class="condition">
        <span id="weather">Loading...</span>
      </div>

      <div class="details">
        <div class="detail">
          <p>Feels Like</p>
          <span id="feels_like">--</span>°C
        </div>

        <div class="detail">
          <p>Humidity</p>
          <span id="humidity">--</span>%
        </div>

        <div class="detail">
          <p>Wind</p>
          <span id="wind">--</span> km/h
        </div>
      </div>
    </div>

    <!-- WEATHER CARDS -->
    <div class="weather-cards">

      <!-- 🔹 ROW 1: HOURLY -->
      <div class="row-top">
        <div class="weather-card hourly-card">
          <h3>Hourly Forecast</h3>
          <div class="hourly" id="hourly"></div>
        </div>
      </div>

      <!-- 🔹 ROW 2: AQI + SUN + MAP -->
      <div class="row-bottom">

        <!-- AQI -->
        <div class="weather-card air-quality">
          <h3>Air Quality</h3>
          <h2 id="air-value">--</h2>
          <p id="air-text">--</p>
        </div>

        <!-- SUNRISE -->
        <div class="weather-card sun-card">
          <h3>Sunrise</h3>
          <p id="sunrise">--</p>
          <p>Sunset: <span id="sunset">--</span></p>
        </div>

        <!-- MAP -->
        <div class="weather-card map-card">
          <h3>Location Map</h3>
          <iframe
            id="mapFrame"
            width="100%"
            height="100%"
            style="border:0; border-radius:15px;"
            loading="lazy"
            allowfullscreen>
          </iframe>
        </div>
<div class="weather-card daily-card">
  <h3>6-Day Forecast</h3>
  <div id="daily"></div>
</div>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
